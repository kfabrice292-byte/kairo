<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Entreprise - KAIRO PRO</title>
    <meta name="theme-color" content="#FFFFFF">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --primary: #F97316;
            --primary-hover: #EA580C;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --surface: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Left Side: Form */
        .split-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
            background: var(--surface);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-dark);
            text-decoration: none;
            position: absolute;
            top: 40px;
            left: 5%;
        }
        .logo span { color: var(--primary); }

        .auth-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        .auth-header p {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-group input {
            width: 100%;
            padding: 16px;
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-dark);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder {
            color: #94A3B8;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
        }
        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 32px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .toggle-auth a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Error Message */
        #auth-error {
            color: #DC2626;
            background: #FEF2F2;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 24px;
            display: none;
            border: 1px solid #FCA5A5;
        }

        /* Right Side: Image Branding */
        .split-right {
            flex: 1.2;
            display: none;
            position: relative;
            background: url('./images/login-bg.jpg') center/cover no-repeat;
        }

        @media (min-width: 900px) {
            .split-right { display: flex; align-items: center; justify-content: center; }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px;
            border-radius: 24px;
            max-width: 500px;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 40px;
        }

        .brand-quote {
            font-size: 2.2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }
        .brand-quote span {
            color: var(--primary);
        }

        .brand-author {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .author-avatar i { color: var(--primary); font-size: 1.5rem; }
        .author-info strong {
            font-weight: 600;
            display: block;
        }
        .author-info span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="split-left">
        <a href="kairo-pro.html" class="logo">KAIRO <span>PRO</span></a>
        
        <div class="auth-wrapper">
            <div class="auth-container">
                <div class="auth-header">
                    <h1 id="auth-title">Connexion</h1>
                    <p id="auth-subtitle">Accédez à votre espace recruteur.</p>
                </div>

                <div id="auth-error"></div>

                <form id="auth-form">
                    <div id="signup-fields" style="display: none;">
                        <div class="form-group" style="margin-bottom: 24px;">
                            <label>Type de compte</label>
                            <div style="display: flex; gap: 16px; margin-top: 8px;">
                                <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.95rem; cursor: pointer;">
                                    <input type="radio" name="agencyType" value="company" checked style="width: auto; padding: 0;">
                                    Entreprise
                                </label>
                                <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.95rem; cursor: pointer;">
                                    <input type="radio" name="agencyType" value="cabinet" style="width: auto; padding: 0;">
                                    Cabinet de recrutement
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nom de l'entreprise / du cabinet</label>
                            <input type="text" id="company-name" placeholder="Ex: Tech Corp">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Professionnel</label>
                        <input type="email" id="email" required placeholder="contact@entreprise.com">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-submit" id="submit-btn">Se connecter</button>
                </form>

                <div class="toggle-auth">
                    <span id="toggle-text">Pas encore de compte ?</span> 
                    <a href="#" id="toggle-btn">S'inscrire</a>
                </div>
            </div>
        </div>
    </div>

    <div class="split-right">
        <div class="glass-panel">
            <div class="brand-quote">
                "KAIRO PRO a <span>complètement transformé</span> notre manière de recruter. Le pipeline visuel nous fait gagner des heures chaque semaine."
            </div>
            <div class="brand-author">
                <div class="author-avatar"><i class="ph-fill ph-quotes"></i></div>
                <div class="author-info">
                    <strong>Directrice RH</strong>
                    <span>Tech Startup Innovante</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/js/modules/pro-login.ts"></script>
</body>
</html>
