<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Kaïro</title>
    <link rel="icon" type="image/png" href="assets/img/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css">
</head>
<body class="bg-white flex flex-col md:flex-row min-h-screen text-slate-800 font-sans">

    <!-- Left: Form Section -->
    <div class="w-full md:w-1/2 flex flex-col relative min-h-screen bg-white">
        <!-- Header -->
        <header class="w-full p-6 lg:p-10 flex justify-between items-center z-10" data-aos="fade-down">
            <a href="index.html" class="flex items-center gap-1 hover:opacity-80 transition-opacity">
                <img src="assets/img/logo.png" alt="Kaïro" class="h-8 lg:h-10 w-auto">
            </a>
            <a href="login.html" class="text-sm font-medium text-slate-500 hover:text-[#F97316] transition-colors md:hidden">
                Se connecter
            </a>
        </header>

        <!-- Main Form -->
        <main class="flex-1 flex items-center justify-center p-6 lg:p-12">
            <div class="w-full max-w-sm" data-aos="fade-up" data-aos-delay="100">
                <div class="mb-8">
                    <h1 class="text-3xl font-extrabold text-slate-900 mb-2 font-outfit tracking-tight">
                        Créer un compte 🚀
                    </h1>
                    <p class="text-slate-500 font-medium">Rejoins Kaïro et génère tes premiers documents.</p>
                </div>

                <form id="registerForm" class="space-y-5">
                    <div class="group">
                        <label for="fullname" class="block text-sm font-bold text-slate-700 mb-1.5 transition-colors group-focus-within:text-[#F97316]">Nom complet</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-user text-slate-400 text-lg transition-colors group-focus-within:text-[#F97316]"></i>
                            </div>
                            <input type="text" id="fullname" autocomplete="name" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#F97316]/10 focus:border-[#F97316] transition-all" placeholder="Ex: Jean Dupont" required>
                        </div>
                    </div>

                    <div class="group">
                        <label for="email" class="block text-sm font-bold text-slate-700 mb-1.5 transition-colors group-focus-within:text-[#F97316]">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-envelope-simple text-slate-400 text-lg transition-colors group-focus-within:text-[#F97316]"></i>
                            </div>
                            <input type="email" id="email" autocomplete="email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#F97316]/10 focus:border-[#F97316] transition-all" placeholder="jean.dupont@email.com" required>
                        </div>
                    </div>

                    <div class="group">
                        <label for="password" class="block text-sm font-bold text-slate-700 mb-1.5 transition-colors group-focus-within:text-[#F97316]">Mot de passe</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-lock text-slate-400 text-lg transition-colors group-focus-within:text-[#F97316]"></i>
                            </div>
                            <input type="password" id="password" autocomplete="new-password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-4 focus:ring-[#F97316]/10 focus:border-[#F97316] transition-all" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-[#F97316] text-white font-bold rounded-xl shadow-lg shadow-[#F97316]/30 hover:bg-[#EA580C] transition-all mt-8 transform hover:-translate-y-0.5">
                        S'inscrire <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </form>

                <div class="mt-8 relative flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative px-4 bg-white text-xs text-slate-400 font-bold uppercase tracking-widest">
                        Ou continuer avec
                    </div>
                </div>

                <button type="button" id="googleRegisterBtn" class="mt-6 w-full flex items-center justify-center gap-3 py-3.5 bg-white border-2 border-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-50 hover:border-slate-200 transition-all transform hover:-translate-y-0.5">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                    Google
                </button>
    </main>

    <script type="module">
        import API from './assets/js/api.js';
        import Toast from './assets/js/toast.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await API.getCurrentUser();
            if (user) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const btn = e.target.querySelector('button[type="submit"]');
                
                try {
                    btn.disabled = true;
                    btn.innerHTML = 'Création en cours... <i class="ph-bold ph-spinner animate-spin"></i>';
                    await API.register(fullname, email, password);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    Toast.error(error.message);
                    btn.disabled = false;
                    btn.innerHTML = "S'inscrire <i class='ph-bold ph-arrow-right'></i>";
                }
            });

            document.getElementById('googleRegisterBtn').addEventListener('click', async (e) => {
                const btn = e.currentTarget;
                try {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Inscription...';
                    await API.loginWithGoogle();
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    Toast.error(error.message);
                    btn.disabled = false;
                    btn.innerHTML = '<img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google"> S\'inscrire avec Google';
                }
            });
        });
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            AOS.init({ duration: 800, once: true });
        });
    </script>
</body>
</html>
