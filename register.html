<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Kaïro</title>
    <link rel="icon" type="image/png" href="assets/img/Favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS (Play CDN for development/static pages) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/base.css">
    <style>
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-white flex min-h-screen text-slate-800 font-sans selection:bg-orange-200 selection:text-orange-900">

    <!-- Left Side: Form Section -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 sm:px-16 lg:px-24 xl:px-32 relative z-10 animate-fade-in-up">
        
        <!-- Mobile Header -->
        <div class="absolute top-8 left-8 lg:hidden">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <img src="assets/img/logo.png" alt="Kaïro" class="h-8 w-auto">
            </a>
        </div>

        <div class="w-full max-w-md mx-auto">
            <!-- Desktop Logo -->
            <a href="index.html" class="hidden lg:block hover:opacity-80 transition-opacity mb-12">
                <img src="assets/img/logo.png" alt="Kaïro" class="h-10 w-auto">
            </a>

            <div class="mb-10">
                <h1 class="text-3xl lg:text-4xl font-bold font-outfit text-slate-900 mb-3 flex items-center gap-2">
                    Créer un compte <i class="ph-fill ph-rocket-launch text-orange-500"></i>
                </h1>
                <p class="text-base text-slate-500">Rejoins Kaïro et génère tes premiers documents.</p>
            </div>

            <!-- Google Register Button -->
            <button type="button" id="googleRegisterBtn" class="w-full flex items-center justify-center gap-3 py-3.5 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 transition-all duration-300 shadow-sm hover:shadow-md mb-6">
                <!-- High-quality Google SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                S'inscrire avec Google
            </button>

            <!-- Divider -->
            <div class="relative flex items-center justify-center mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200"></div>
                </div>
                <div class="relative px-4 bg-white text-xs text-slate-400 font-bold uppercase tracking-wider">
                    Ou avec email
                </div>
            </div>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label for="fullname" class="block text-sm font-semibold text-slate-700 mb-1.5">Nom complet</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="ph-bold ph-user text-slate-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
                        </div>
                        <input type="text" id="fullname" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-500 transition-all placeholder:text-slate-400" placeholder="Ex: Fabrice Kaboré" required>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Adresse Email</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="ph-bold ph-envelope-simple text-slate-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
                        </div>
                        <input type="email" id="email" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-500 transition-all placeholder:text-slate-400" placeholder="fabrice@email.com" required>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Mot de passe</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="ph-bold ph-lock text-slate-400 text-lg group-focus-within:text-orange-500 transition-colors"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-500 transition-all placeholder:text-slate-400" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full flex items-center justify-center gap-2 py-4 px-4 bg-slate-900 text-white font-bold rounded-xl shadow-lg shadow-slate-900/20 hover:bg-orange-500 hover:shadow-orange-500/30 transition-all duration-300 transform hover:-translate-y-0.5 mt-8">
                    S'inscrire <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>
            
            <p class="text-center mt-8 text-sm text-slate-500">
                Déjà un compte ? <a href="login.html" class="text-slate-900 font-bold hover:text-orange-500 transition-colors">Connecte-toi</a>
            </p>
        </div>
    </div>

    <!-- Right Side: Visual Section -->
    <div class="hidden lg:flex w-1/2 bg-slate-900 relative items-center justify-center overflow-hidden">
        <!-- Orange Glow -->
        <div class="absolute top-1/4 -left-20 w-[500px] h-[500px] bg-orange-500 rounded-full mix-blend-screen filter blur-[150px] opacity-60"></div>
        <div class="absolute bottom-1/4 -right-20 w-[400px] h-[400px] bg-blue-500 rounded-full mix-blend-screen filter blur-[150px] opacity-40"></div>

        <div class="relative z-10 max-w-md text-center p-8">
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-10 rounded-3xl shadow-2xl">
                <i class="ph-duotone ph-rocket text-5xl text-orange-400 mb-6"></i>
                <h3 class="text-2xl font-bold font-outfit text-white mb-4">Prêt à propulser ta carrière ?</h3>
                <p class="text-base font-medium text-slate-300 leading-relaxed mb-8">
                    Rejoins des milliers de talents qui utilisent Kaïro pour générer des CV percutants, des lettres de motivation sur-mesure et gérer leurs candidatures.
                </p>
                <div class="flex justify-center gap-2">
                    <div class="w-12 h-1 bg-orange-500 rounded-full"></div>
                    <div class="w-2 h-1 bg-white/20 rounded-full"></div>
                    <div class="w-2 h-1 bg-white/20 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import API from './assets/js/api.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await API.getCurrentUser();
            if (user) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const btn = e.target.querySelector('button[type="submit"]');
                
                try {
                    btn.disabled = true;
                    btn.innerHTML = 'Création en cours... <i class="ph-bold ph-spinner animate-spin"></i>';
                    await API.register(fullname, email, password);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert(error.message);
                    btn.disabled = false;
                    btn.innerHTML = "S'inscrire <i class='ph-bold ph-arrow-right'></i>";
                }
            });

            document.getElementById('googleRegisterBtn').addEventListener('click', async (e) => {
                const btn = e.currentTarget;
                const originalHtml = btn.innerHTML;
                try {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Inscription...';
                    await API.loginWithGoogle();
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert(error.message);
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            });
        });
    </script>
</body>
</html>
